<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NEUEnglish</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>NEUEnglish</h1>
        <h2>不要把时间花在洋人身上</h2>
    </header>

    <main>
        <!-- 范围：教程 + Unit + 快速测试（小图标） -->
        <div class="scope-bar">
            <select id="bookSelect" aria-label="选择教程"></select>
            <select id="unitSelect" aria-label="选择单元"></select>
            <button class="icon-btn" id="quickTestBtn" title="快速测试（10 题）" aria-label="快速测试">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                     stroke="currentColor" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>
                </svg>
            </button>
        </div>

        <!-- 题型 -->
        <div class="mode-bar" role="group" aria-label="题型">
            <button type="button" class="chip active" data-mode="en2zh">英 → 中</button>
            <button type="button" class="chip" data-mode="zh2en">中 → 英</button>
            <button type="button" class="chip" data-mode="mixed">混合</button>
        </div>

        <!-- 题目区 -->
        <div id="quizArea">
            <div class="card" id="card">
                <p id="Meaning">加载中…</p>
            </div>

            <div id="options" class="options-grid" hidden></div>

            <div id="answerArea" class="answer-area" hidden>
                <input type="text" id="wordInput" placeholder="请输入英文单词"
                       autocomplete="off" autocapitalize="off" spellcheck="false">
                <button class="btn-primary" id="submitBtn" onclick="checkWord()">确定</button>
            </div>

            <p class="retry-hint" id="retryHint" hidden>✗ 拼写有误，再试一次</p>
            <p class="answer-hint" id="answerHint" hidden></p>

            <!-- 操作行：查看答案 + 下一题 -->
            <div class="action-row">
                <button class="btn-ghost" id="showAnswerBtn" hidden onclick="showAnswer()">查看答案</button>
                <button class="btn-secondary next-btn" onclick="nextQuestion()">下一题</button>
            </div>
        </div>

        <!-- 本组小结 -->
        <div class="summary" id="summary" hidden>
            <h3 class="summary-title">本组完成！</h3>
            <div class="summary-rate-wrap">
                <span class="summary-rate" id="sumRate">0%</span>
                <span class="summary-sub">正确率</span>
            </div>
            <p class="summary-count">答对 <strong id="sumCorrect">0</strong> / <span id="sumTotal">0</span></p>
            <div class="summary-wrong" id="sumWrong"></div>
            <button class="btn-primary" onclick="restartSession()">再来一组</button>
        </div>

        <div class="stats" id="stats"></div>
    </main>

    <footer>
        <p>&copy; 2026</p>
    </footer>

    <script src="words.js"></script>
    <script src="app.js"></script>
</body>
</html>
